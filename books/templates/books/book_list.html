<!DOCTYPE html>
<html>
<head>
    <title>Book Management System</title>
</head>
<body>
    <h1>Book List</h1>
    <a href="{% url 'book_create' %}">Add New Book</a>
    <hr>
    <table border="1" cellpadding="5">
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Price ($)</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for book in books %}
            <tr>
                <td>{{ book.title }}</td>
                <td>{{ book.author }}</td>
                <td>{{ book.price }}</td>
                <td>
                    <a href="{% url 'book_update' book.pk %}">Update Price</a> | 
                    <a href="{% url 'book_delete' book.pk %}">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No books available.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
