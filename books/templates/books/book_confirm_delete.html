<!DOCTYPE html>
<html>
<head>
    <title>Confirm Delete</title>
</head>
<body>
    <h1>Delete Book</h1>
    <p>Are you sure you want to delete "<strong>{{ book.title }}</strong>" by {{ book.author }}?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="color: red;">Yes, Delete</button>
    </form>
    <br>
    <a href="{% url 'book_list' %}">Cancel and Go Back</a>
</body>
</html>
